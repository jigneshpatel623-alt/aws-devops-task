name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      force_unlock_id:
        description: "Stale state lock ID to release before planning (from an 'Error acquiring the state lock' message). Leave empty normally."
        required: false
        default: ""

permissions:
  id-token: write       # OIDC -> AWS (no stored access keys)
  contents: read
  pull-requests: write  # post plan as PR comment

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  WORKDIR: terraform/envs/dev
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_app_subdomain: ${{ vars.APP_SUBDOMAIN }}
  # TF_VAR_domain_name is set per job from the validate job's "Resolve effective domain" step

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      domain_name: ${{ steps.domain.outputs.domain_name }}
    steps:
      - uses: actions/checkout@v7

      # ACM DNS validation can only succeed if the domain is publicly delegated.
      # A domain that is unregistered, on registry hold (serverHold) or not yet
      # pointed at the Route 53 name servers makes the apply hang until the AWS
      # session expires. Decide the certificate mode here on every run: use the
      # custom domain when it resolves publicly, otherwise fall back to the
      # self-signed certificate on the ALB DNS name. The next run switches back
      # automatically once the domain resolves again.
      - name: Resolve effective domain
        id: domain
        env:
          DOMAIN: ${{ vars.DOMAIN_NAME }}
        run: |
          effective="$DOMAIN"
          if [ -z "$DOMAIN" ]; then
            echo "DOMAIN_NAME is not set: self-signed certificate on the ALB DNS name"
          elif ! resp=$(curl -fsS --max-time 15 "https://dns.google/resolve?name=${DOMAIN}&type=NS"); then
            echo "::warning::Could not query public DNS for ${DOMAIN}; assuming it is delegated"
          else
            status=$(echo "$resp" | jq -r '.Status')
            ns=$(echo "$resp" | jq -r '[.Answer[]? | select(.type == 2) | .data] | join(" ")')
            if [ "$status" != "0" ] || [ -z "$ns" ]; then
              effective=""
              echo "::warning::${DOMAIN} has no public NS records (DNS status ${status}; 3 = NXDOMAIN), so an ACM certificate for it cannot be validated. Falling back to a self-signed certificate on the ALB DNS name. Check the domain's registration status at the registrar (e.g. serverHold / unverified contact email) and its name servers; the next run uses the domain again once it resolves."
            else
              echo "${DOMAIN} is delegated to: ${ns}"
            fi
          fi
          echo "domain_name=${effective}" >> "$GITHUB_OUTPUT"
          echo "Certificate mode: ${effective:-self-signed (no usable custom domain)}" >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: terraform init (no backend)
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate -no-color

  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true   # report only; does not block the pipeline

  # ---------------------------------------------------------------------------
  plan:
    name: Terraform Plan
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_domain_name: ${{ needs.validate.outputs.domain_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # Only for a lock left behind by a run that died without releasing it.
      # The concurrency group guarantees no other run of this workflow holds it.
      - name: Release stale state lock
        if: github.event_name == 'workflow_dispatch' && inputs.force_unlock_id != ''
        working-directory: ${{ env.WORKDIR }}
        env:
          LOCK_ID: ${{ inputs.force_unlock_id }}
        run: terraform force-unlock -force "$LOCK_ID"

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -input=false -no-color -lock-timeout=5m

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const max = 60000;
            let plan = process.env.PLAN || '';
            if (plan.length > max) plan = plan.substring(plan.length - max);
            const body = `### Terraform Plan (dev)\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n</details>\n\n*Triggered by @${context.actor}*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ---------------------------------------------------------------------------
  apply:
    name: Terraform Apply
    needs: [validate, plan, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TF_VAR_domain_name: ${{ needs.validate.outputs.domain_name }}
    # Must stay below the 1h OIDC session: an apply that outlives its credentials
    # cannot save state or release the state lock.
    timeout-minutes: 50
    environment: production   # add required reviewers in repo settings for manual approval
    outputs:
      app_url: ${{ steps.out.outputs.app_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # AWS creates this role on first use of Auto Scaling, but a role created
      # seconds before the first ASG launch is not yet usable ("Access denied when
      # attempting to assume role ... AWSServiceRoleForAutoScaling"). Create it
      # ahead of time and give IAM a moment to propagate. No-op if it exists.
      - name: Ensure Auto Scaling service-linked role
        run: |
          if out=$(aws iam create-service-linked-role --aws-service-name autoscaling.amazonaws.com 2>&1); then
            echo "Created AWSServiceRoleForAutoScaling; waiting 60s for IAM propagation"
            sleep 60
          elif echo "$out" | grep -q "has been taken"; then
            echo "AWSServiceRoleForAutoScaling already exists"
          else
            echo "$out"
            exit 1
          fi

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -input=false -auto-approve -lock-timeout=5m

      - name: Read outputs
        id: out
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment complete"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| App URL | $(terraform output -raw app_url) |"
            echo "| ALB DNS | $(terraform output -raw alb_dns_name) |"
            echo "| ASG | $(terraform output -raw asg_name) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  smoke-test:
    name: Health Check
    needs: [apply]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: End-to-end health checks
        run: bash scripts/health_check.sh "${{ needs.apply.outputs.app_url }}"
