name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete all dev infrastructure'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  WORKDIR: terraform/envs/dev
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_app_subdomain: ${{ vars.APP_SUBDOMAIN }}

jobs:
  destroy:
    if: github.event.inputs.confirm == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # RDS and the ALB have deletion protection on; switch it off first
      - name: Disable deletion protection
        working-directory: ${{ env.WORKDIR }}
        run: >
          terraform apply -input=false -auto-approve -lock-timeout=5m
          -var="deletion_protection=false"
          -target=module.rds.aws_db_instance.this
          -target=module.alb.aws_lb.this

      - name: terraform destroy
        working-directory: ${{ env.WORKDIR }}
        run: terraform destroy -input=false -auto-approve -lock-timeout=5m -var="deletion_protection=false"
